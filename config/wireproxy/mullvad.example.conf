# Example: Using Mullvad VPN with Wireproxy
# Mullvad provides free, no-account VireGuard access
# You can rotate through different exit nodes for IP rotation

# Step 1: Get Mullvad WireGuard config
# Visit: https://mullvad.net/en/account/#/wireguard-config/
# Download a WireGuard config or get the details

# Step 2: Replace values below with your Mullvad credentials

[Interface]
# Your Mullvad-assigned address
Address = 10.64.XX.XX/32
# Your Mullvad private key
PrivateKey = YOUR_MULLVAD_PRIVATE_KEY_HERE
# Mullvad DNS
DNS = 1.1.1.1

[Peer]
# Mullvad public key for this endpoint
PublicKey = YOUR_MULLVAD_PUBLIC_KEY_HERE
# Mullvad WireGuard endpoint (changes by location)
# Examples:
# Sweden: 193.67.79.5:51820
# Germany: 212.102.49.1:51820
# Netherlands: 185.218.125.1:51820
# US-East: 192.36.27.130:51820
# Singapore: 103.245.75.132:51820
Endpoint = 193.67.79.5:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25

# SOCKS5 proxy - first instance on port 9001
[Socks5]
BindAddress = 127.0.0.1:9001

# ============================================
# USAGE NOTES
# ============================================
# 1. Replace YOUR_MULLVAD_PRIVATE_KEY_HERE with your private key
# 2. Replace YOUR_MULLVAD_PUBLIC_KEY_HERE with Mullvad's public key
# 3. Change Endpoint to a different server location for testing
# 4. Save as proxy1.conf in config/wireproxy/
# 5. Run wireproxy: wireproxy -c config/wireproxy/proxy1.conf
# 6. Test SOCKS5 proxy: curl -x socks5://127.0.0.1:9001 https://ipinfo.io
#
# IMPORTANT: For rotating IPs, create multiple proxy configs
# pointing to different Mullvad endpoints or other VPN providers
